<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WIDE - Browser Python IDE</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>

<style>
body{margin:0;background:#0b0f14;color:white;font-family:Segoe UI;}
#topbar{background:#111;padding:15px;font-size:22px;text-align:center;border-bottom:2px solid #00f7ff;}
#toolbar{display:flex;justify-content:center;gap:15px;padding:10px;background:#111;}
button{padding:8px 18px;background:#1a1a1a;color:white;border:1px solid #333;border-radius:8px;cursor:pointer;}
#main{display:flex;height:85vh;}
#editorContainer{width:50%;}
#outputContainer{width:50%;background:black;padding:10px;color:#00ff88;overflow:auto;}
#authScreen{position:fixed;inset:0;background:#111;display:flex;justify-content:center;align-items:center;}
#authBox{background:#000;padding:30px;border-radius:20px;text-align:center;}
#learnPython{display:none;padding:30px;}
.box{border:1px solid #00f7ff;padding:10px;margin:10px 0;min-height:60px;white-space:pre-wrap;}
</style>
</head>

<body>

<div id="authScreen">
  <div id="authBox">
    <h2>Login / Sign Up</h2>
    <p>You can only access and save files if you log in</p>
    <input id="username" placeholder="Username"><br>
    <input id="password" type="password" placeholder="Password"><br><br>
    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>
    <button onclick="guest()">Use as Guest</button>
    <p id="authMessage"></p>
  </div>
</div>

<div id="topbar">WIDE - Python IDE</div>

<div id="toolbar">
  <button onclick="runCode()">Run</button>
  <button onclick="newFile()">New</button>
  <button onclick="copyCode()">Copy</button>
  <button id="saveBtn" onclick="saveFile()" style="display:none;">Save</button>
  <button id="learnBtn" onclick="openLearnPython()" style="display:none;">LEARN PYTHON</button>
  <button onclick="logout()">Logout</button>
</div>

<div id="main">
  <textarea id="code">print("Welcome to WIDE!")</textarea>
  <div id="outputContainer"></div>
</div>

<div id="learnPython">
  <h1>WELCOME - Follow the steps to start your coding journey</h1>

  <div id="learnToolbar" style="display:none;">
    <button onclick="formatText('bold')">Bold</button>
    <button onclick="highlightText()">Highlight</button>
    <button onclick="addLink()">Add Link</button>
    <button onclick="addBox()">Add Box</button>
  </div>

  <div contenteditable="true" id="learnContent"></div>

  <button onclick="returnToEditor()">Return to Code Editor</button>
  <button id="saveLearnBtn" style="display:none;">Save Learn Content</button>
</div>

<script>
let editor = CodeMirror.fromTextArea(document.getElementById("code"),{
  mode:"python",
  theme:"dracula",
  lineNumbers:true
});

let currentUser=null;
const MASTER="Willspurs21";
const MASTER_PASS="Will_spurs21";

/* AUTH */
function signup(){
  let u=username.value.trim();
  let p=password.value.trim();
  if(!u||!p)return;
  if(localStorage.getItem("user_"+u)){
    authMessage.innerText="User exists.";
    return;
  }
  localStorage.setItem("user_"+u,p);
  authMessage.innerText="Signup successful!";
}

function login(){
  let u=username.value.trim();
  let p=password.value.trim();

  if(u===MASTER && p===MASTER_PASS){
    currentUser=u;
    startIDE(true);
    return;
  }

  let stored=localStorage.getItem("user_"+u);
  if(!stored){authMessage.innerText="No account.";return;}
  if(stored!==p){authMessage.innerText="Wrong password.";return;}

  currentUser=u;
  startIDE(false);
}

function guest(){currentUser="guest";startIDE(false);}
function logout(){location.reload();}

/* START */
function startIDE(isMaster){
  document.getElementById("authScreen").style.display="none";
  document.getElementById("learnBtn").style.display="inline-block";
  if(currentUser!=="guest") document.getElementById("saveBtn").style.display="inline-block";

  if(currentUser===MASTER){
    document.getElementById("learnToolbar").style.display="flex";
    document.getElementById("saveLearnBtn").style.display="inline-block";
    addAdminPanel();
  }

  addFiles();
}

/* FILES */
function addFiles(){
  let btn=document.createElement("button");
  btn.textContent="Files";
  document.getElementById("toolbar").appendChild(btn);

  btn.onclick=()=>{
    let choice=prompt("Type add OR view");

    if(choice==="add"){
      let name=prompt("File name:");
      if(name){
        localStorage.setItem("file_"+currentUser+"_"+name,"");
        editor.setValue("");
      }
    }

    if(choice==="view"){
      let found=false;
      for(let i=0;i<localStorage.length;i++){
        let k=localStorage.key(i);
        if(k.startsWith("file_"+currentUser+"_")){
          found=true;
          alert(k.replace("file_"+currentUser+"_",""));
        }
      }
      if(!found) alert("No files present");
    }
  };
}

/* MASTER VIEW USERS */
function addAdminPanel(){
  let btn=document.createElement("button");
  btn.textContent="Other Users";
  document.getElementById("toolbar").appendChild(btn);

  btn.onclick=()=>{
    let output="";
    for(let i=0;i<localStorage.length;i++){
      let key=localStorage.key(i);
      if(key.startsWith("user_") && key!=="user_"+MASTER){
        let user=key.replace("user_","");
        output+="User: "+user+"\n";

        let hasFiles=false;
        for(let j=0;j<localStorage.length;j++){
          let f=localStorage.key(j);
          if(f.startsWith("file_"+user+"_")){
            output+="  - "+f.replace("file_"+user+"_","")+"\n";
            hasFiles=true;
          }
        }
        if(!hasFiles) output+="  (No files)\n";
      }
    }
    alert(output||"No users found");
  };
}

/* LEARN */
function openLearnPython(){
  document.getElementById("main").style.display="none";
  document.getElementById("learnPython").style.display="block";
}
function returnToEditor(){
  document.getElementById("learnPython").style.display="none";
  document.getElementById("main").style.display="flex";
}

document.getElementById("saveLearnBtn").onclick=()=>{
  localStorage.setItem("learnContent",document.getElementById("learnContent").innerHTML);
  alert("Saved!");
};

function formatText(cmd){document.execCommand(cmd,false,null);}

function highlightText(){
  document.execCommand("hiliteColor",false,"yellow");
}

function addLink(){
  let url=prompt("Enter URL:");
  if(url) document.execCommand("createLink",false,url);
}

function addBox(){
  let box=document.createElement("div");
  box.className="box";
  box.contentEditable="true";
  box.innerHTML="Type here...";
  document.getElementById("learnContent").appendChild(box);
}

/* RUN */
function runCode(){
  let out=document.getElementById("outputContainer");
  out.innerHTML="";
  Sk.configure({output:txt=>out.innerHTML+=txt+"<br>"});
  Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody("<stdin>",false,editor.getValue(),true));
}

function newFile(){editor.setValue("");}
function copyCode(){navigator.clipboard.writeText(editor.getValue());}
function saveFile(){
  if(currentUser==="guest"){alert("Guests cannot save");return;}
  let name=prompt("File name:");
  if(!name)return;
  localStorage.setItem("file_"+currentUser+"_"+name,editor.getValue());
  alert("Saved!");
}
</script>

</body>
</html>
