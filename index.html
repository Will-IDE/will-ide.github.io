<script>

/* ================= FIX 1: HIGHLIGHT ================= */
function formatText(command){
  if(command==="highlight"){
    let selection = window.getSelection();
    if(!selection.rangeCount) return;

    let range = selection.getRangeAt(0);
    let span = document.createElement("span");
    span.style.background = "#00f7ff55";

    span.appendChild(range.extractContents());
    range.insertNode(span);
  } else {
    document.execCommand(command,false,null);
  }
}

/* ================= FIX 2: MULTI-LINE BOX ================= */
function addBox(){
  let box = document.createElement("div");
  box.style.border="1px solid #00f7ff";
  box.style.padding="10px";
  box.style.margin="10px 0";
  box.style.background="#111";
  box.style.color="#00ff88";
  box.style.minHeight="60px";
  box.contentEditable="true";
  box.innerHTML="Type here...";

  box.addEventListener("keydown",function(e){
    if(e.key==="Enter"){
      e.preventDefault();
      document.execCommand("insertHTML", false, "<br><br>");
    }
  });

  document.getElementById("learnContent").appendChild(box);
}

/* ================= FIX 3: MASTER ADMIN PANEL ================= */
/* ADD THIS AT THE VERY END OF startIDE(isMaster) FUNCTION */

if(currentUser === MASTER_ACCOUNT){

  let adminBtn = document.createElement("button");
  adminBtn.textContent = "Other Users";
  toolbar.appendChild(adminBtn);

  let dropdown = document.createElement("div");
  dropdown.className = "dropdown";
  toolbar.appendChild(dropdown);

  adminBtn.addEventListener("click",()=>{
    dropdown.classList.toggle("show");
    dropdown.innerHTML="";

    for(let i=0;i<localStorage.length;i++){
      let key = localStorage.key(i);

      if(key.startsWith("user_") && key!=="user_"+MASTER_ACCOUNT){

        let username = key.replace("user_","");

        let userBtn = document.createElement("button");
        userBtn.textContent = username;

        userBtn.addEventListener("click",()=>{

          if(userBtn.nextSibling && userBtn.nextSibling.classList.contains("dropdown")){
            userBtn.nextSibling.remove();
            return;
          }

          let filesDiv = document.createElement("div");
          filesDiv.className="dropdown";
          filesDiv.style.background="#222";

          let hasFiles=false;

          for(let j=0;j<localStorage.length;j++){
            let k=localStorage.key(j);

            if(k.startsWith("file_"+username+"_")){
              let fileBtn=document.createElement("button");
              fileBtn.textContent=k.replace("file_"+username+"_","");
              fileBtn.onclick=()=>editor.setValue(localStorage.getItem(k));
              filesDiv.appendChild(fileBtn);
              hasFiles=true;
            }
          }

          if(!hasFiles){
            let none=document.createElement("button");
            none.textContent="No files";
            filesDiv.appendChild(none);
          }

          userBtn.parentNode.insertBefore(filesDiv, userBtn.nextSibling);
        });

        dropdown.appendChild(userBtn);
      }
    }
  });
}

</script>
