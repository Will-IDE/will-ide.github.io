<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WIDE - Browser Python IDE</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>

<style>
body{margin:0;background:#0b0f14;color:white;font-family:Segoe UI;}

#topbar{
  background:#111;
  padding:15px;
  font-size:22px;
  text-align:center;
  border-bottom:2px solid #00f7ff;
  text-shadow:0 0 8px #00f7ff;
}

#toolbar{
  display:flex;
  justify-content:center;
  gap:15px;
  padding:10px;
  background:#111;
  border-bottom:1px solid #222;
  position:relative;
}

button{
  padding:8px 18px;
  background:#1a1a1a;
  color:white;
  border:1px solid #333;
  border-radius:8px;
  cursor:pointer;
  transition:0.2s;
}
button:hover{
  border-color:#00f7ff;
  color:#00f7ff;
  box-shadow:0 0 8px #00f7ff;
}

/* UPDATED DROPDOWN */
.dropdown{
  position:fixed;
  top:120px;
  right:20px;
  background:#111;
  border:1px solid #333;
  display:none;
  flex-direction:column;
  min-width:220px;
  z-index:200;
  box-shadow:0 0 15px #00f7ff55;
}

.dropdown.show{display:flex;}

.dropdown-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px;
  border-bottom:1px solid #222;
}

.close-btn{
  cursor:pointer;
  color:#ff4c4c;
  font-weight:bold;
}

.dropdown button{
  background:#111;
  border:none;
  border-bottom:1px solid #222;
  text-align:left;
  padding:8px 12px;
  border-radius:0;
}
.dropdown button:hover{background:#1a1a1a;color:#00f7ff;}

#main{
  display:flex;
  height:85vh;
}

#editorContainer{
  width:50%;
  height:100%;
}

#divider{
  width:5px;
  cursor:col-resize;
  background:#00f7ff;
}

#outputContainer{
  width:50%;
  background:#000;
  padding:15px;
  overflow-y:auto;
  font-family:monospace;
  color:#00ff88;
  box-shadow:inset 0 0 20px #00ff8855;
}

.output-line{margin-bottom:4px;}
.error{color:#ff4c4c;}

.input-line{
  display:flex;
  align-items:center;
  margin-top:4px;
}

.prompt{
  margin-right:6px;
  color:#00f7ff;
}

.terminal-input{
  background:black;
  border:none;
  outline:none;
  color:#00ff88;
  font-family:monospace;
  flex:1;
}

.blinking-cursor::after{
  content:"|";
  animation:blink 1s infinite;
}

@keyframes blink{
  0%{opacity:1;}
  50%{opacity:0;}
  100%{opacity:1;}
}

.loading{
  animation:spin 1s linear infinite;
}
@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

#authScreen{
  position:fixed;
  inset:0;
  background:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:100;
}

#authBox{
  background:#000;
  padding:30px;
  border-radius:20px;
  text-align:center;
  width:320px;
  box-shadow:0 0 20px #00f7ff55;
}

#authBox p{
  font-size:14px;
  color:#aaa;
}

input{
  width:90%;
  padding:8px;
  margin:8px 0;
  background:#111;
  border:1px solid #333;
  color:white;
}

/* KEEP REST OF YOUR CSS SAME */
</style>
</head>

<body>

<!-- EVERYTHING ABOVE UNCHANGED -->

<script>
let currentFileKey=null;

/* AUTO SAVE */
editor.on("change",()=>{
  if(currentFileKey){
    localStorage.setItem(currentFileKey, editor.getValue());
  }
});
</script>

header.className="dropdown-header";

title.textContent="Files";

let closeBtn=document.createElement("span");
closeBtn.textContent="✖";
closeBtn.className="close-btn";
closeBtn.onclick=()=>filesDropdown.classList.remove("show");

header.appendChild(title);
header.appendChild(closeBtn);
filesDropdown.appendChild(header);

document.body.appendChild(filesDropdown);

</body>
</html>
