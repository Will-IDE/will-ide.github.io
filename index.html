<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WIDE - Browser Python IDE</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>

<style>
body{margin:0;background:#0b0f14;color:white;font-family:Segoe UI;}
#topbar{background:#111;padding:15px;font-size:22px;text-align:center;border-bottom:2px solid #00f7ff;}
#toolbar{display:flex;justify-content:center;gap:15px;padding:10px;background:#111;}
button{padding:8px 18px;background:#1a1a1a;color:white;border:1px solid #333;border-radius:8px;cursor:pointer;}
button:hover{border-color:#00f7ff;color:#00f7ff;}

.dropdown{position:absolute;background:#111;border:1px solid #333;display:none;flex-direction:column;}
.dropdown.show{display:flex;}

#main{display:flex;height:85vh;}
#editorContainer{width:50%;}
#divider{width:5px;background:#00f7ff;cursor:col-resize;}
#outputContainer{width:50%;background:#000;padding:15px;color:#00ff88;font-family:monospace;overflow:auto;}

#authScreen{position:fixed;inset:0;background:#111;display:flex;justify-content:center;align-items:center;}
#authBox{background:#000;padding:30px;border-radius:20px;text-align:center;width:320px;}

input{width:90%;padding:8px;margin:8px 0;background:#111;border:1px solid #333;color:white;}

#learnPython{display:none;flex-direction:column;align-items:center;padding:40px;}
#learnContent{width:80%;min-height:200px;background:#111;border:1px solid #00f7ff;padding:20px;}
#learnToolbar{display:none;gap:10px;margin:10px;}
.box{border:1px solid #00f7ff;padding:10px;margin:10px 0;min-height:50px;}
</style>
</head>

<body>

<div id="authScreen">
  <div id="authBox">
    <h2>Login / Sign Up</h2>
    <p>You can only access and save files if you log in or sign up.</p>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <br>
    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>
    <button onclick="guest()">Use as Guest</button>
    <p id="authMessage"></p>
  </div>
</div>

<div id="topbar">WIDE - Python IDE</div>

<div id="toolbar">
  <button onclick="runCode()">Run</button>
  <button onclick="newFile()">New</button>
  <button onclick="copyCode()">Copy</button>
  <button id="saveBtn" onclick="saveFile()" style="display:none;">Save</button>
  <button id="learnBtn" onclick="openLearn()" style="display:none;">LEARN PYTHON</button>
  <button onclick="logout()">Logout</button>
</div>

<div id="main">
  <textarea id="code">print("Welcome to WIDE!")</textarea>
  <div id="outputContainer"></div>
</div>

<div id="learnPython">
  <h1>WELCOME - Follow the steps to start your coding journey</h1>

  <div id="learnToolbar">
    <button onclick="format('bold')">Bold</button>
    <button onclick="format('italic')">Italic</button>
    <button onclick="format('underline')">Underline</button>
    <button onclick="highlightText()">Highlight</button>
    <button onclick="addBox()">Add Box</button>
    <button onclick="addLink()">Link</button>
  </div>

  <div id="learnContent" contenteditable="true"></div>

  <button onclick="saveLearn()" id="saveLearnBtn" style="display:none;">Save</button>
  <button onclick="back()">Return</button>
</div>

<script>
let editor = CodeMirror.fromTextArea(document.getElementById("code"),{
  mode:"python",
  theme:"dracula",
  lineNumbers:true
});

let currentUser=null;
const MASTER="Willspurs21";
const PASS="Will_spurs21";

/* AUTH */
function signup(){
  let u=username.value,p=password.value;
  if(localStorage.getItem("user_"+u)){authMessage.innerText="User exists";return;}
  localStorage.setItem("user_"+u,p);
  authMessage.innerText="Signed up";
}

function login(){
  let u=username.value,p=password.value;

  if(u===MASTER && p===PASS){currentUser=u;start(true);return;}

  if(localStorage.getItem("user_"+u)!==p){
    authMessage.innerText="Wrong details";return;
  }

  currentUser=u;
  start(false);
}

function guest(){currentUser="guest";start(false);}
function logout(){location.reload();}

/* START */
function start(master){
  authScreen.style.display="none";
  document.getElementById("learnBtn").style.display="inline-block";
  if(currentUser!=="guest") saveBtn.style.display="inline-block";

  if(master){
    document.getElementById("learnToolbar").style.display="flex";
    document.getElementById("saveLearnBtn").style.display="inline-block";

    // ADMIN
    let btn=document.createElement("button");
    btn.textContent="Admin";
    toolbar.appendChild(btn);

    let drop=document.createElement("div");
    drop.className="dropdown";
    toolbar.appendChild(drop);

    btn.onclick=()=>{
      drop.classList.toggle("show");
      drop.innerHTML="";

      for(let i=0;i<localStorage.length;i++){
        let k=localStorage.key(i);
        if(k.startsWith("user_")){
          let user=k.replace("user_","");
          let b=document.createElement("button");
          b.textContent=user;

          b.onclick=()=>{
            drop.innerHTML="";
            let found=false;

            for(let j=0;j<localStorage.length;j++){
              let f=localStorage.key(j);
              if(f.startsWith("file_"+user+"_")){
                let fb=document.createElement("button");
                fb.textContent=f.replace("file_"+user+"_","");
                fb.onclick=()=>editor.setValue(localStorage.getItem(f));
                drop.appendChild(fb);
                found=true;
              }
            }

            if(!found){
              let none=document.createElement("button");
              none.textContent="No files";
              drop.appendChild(none);
            }
          };

          drop.appendChild(b);
        }
      }
    };
  }
}

/* LEARN PAGE */
function openLearn(){
  main.style.display="none";
  learnPython.style.display="flex";
}

function back(){
  learnPython.style.display="none";
  main.style.display="flex";
}

function saveLearn(){
  localStorage.setItem("learn",learnContent.innerHTML);
  alert("Saved");
}

function format(cmd){document.execCommand(cmd);}

/* FIXED HIGHLIGHT */
function highlightText(){
  let sel=window.getSelection();
  if(!sel.rangeCount) return;

  let span=document.createElement("span");
  span.style.background="yellow";
  span.appendChild(sel.getRangeAt(0).extractContents());
  sel.getRangeAt(0).insertNode(span);
}

/* FIXED MULTI-LINE BOX */
function addBox(){
  let box=document.createElement("div");
  box.className="box";
  box.contentEditable=true;
  box.innerHTML="Type here...";

  box.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      document.execCommand("insertLineBreak");
      e.preventDefault();
    }
  });

  learnContent.appendChild(box);
}

function addLink(){
  let url=prompt("Enter link:");
  if(url) document.execCommand("createLink",false,url);
}

/* CODE */
function runCode(){
  outputContainer.innerHTML="";
  Sk.configure({
    output:text=>{
      let d=document.createElement("div");
      d.textContent=text;
      outputContainer.appendChild(d);
    },
    read:x=>Sk.builtinFiles.files[x]
  });

  Sk.misceval.asyncToPromise(()=>{
    return Sk.importMainWithBody("<stdin>",false,editor.getValue(),true);
  });
}

function newFile(){editor.setValue("");}
function copyCode(){navigator.clipboard.writeText(editor.getValue());}

function saveFile(){
  let name=prompt("File name:");
  if(!name)return;
  localStorage.setItem("file_"+currentUser+"_"+name,editor.getValue());
  alert("Saved");
}
</script>

</body>
</html>
