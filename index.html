<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WIDE - Browser Python IDE</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>

<style>
body{margin:0;background:#0b0f14;color:white;font-family:Segoe UI;}

#topbar{
  background:#111;
  padding:15px;
  font-size:22px;
  text-align:center;
  border-bottom:2px solid #00f7ff;
  text-shadow:0 0 8px #00f7ff;
}

#toolbar{
  display:flex;
  justify-content:center;
  gap:15px;
  padding:10px;
  background:#111;
  border-bottom:1px solid #222;
  position:relative;
}

button{
  padding:8px 18px;
  background:#1a1a1a;
  color:white;
  border:1px solid #333;
  border-radius:8px;
  cursor:pointer;
  transition:0.2s;
}
button:hover{
  border-color:#00f7ff;
  color:#00f7ff;
  box-shadow:0 0 8px #00f7ff;
}

/* UPDATED DROPDOWN */
.dropdown{
  position:fixed;
  top:120px;
  right:20px;
  background:#111;
  border:1px solid #333;
  display:none;
  flex-direction:column;
  width:220px;
  z-index:200;
  box-shadow:0 0 15px #00f7ff55;
}

.dropdown-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px;
  border-bottom:1px solid #222;
}

.close-btn{
  cursor:pointer;
  color:#ff4c4c;
  font-weight:bold;
}

.dropdown.show{display:flex;}

.dropdown button{
  background:#111;
  border:none;
  border-bottom:1px solid #222;
  text-align:left;
  padding:8px 12px;
  border-radius:0;
}
.dropdown button:hover{background:#1a1a1a;color:#00f7ff;}

#main{
  display:flex;
  height:85vh;
}

#editorContainer{width:50%;height:100%;}
#divider{width:5px;cursor:col-resize;background:#00f7ff;}

#outputContainer{
  width:50%;
  background:#000;
  padding:15px;
  overflow-y:auto;
  font-family:monospace;
  color:#00ff88;
  box-shadow:inset 0 0 20px #00ff8855;
}

.output-line{margin-bottom:4px;}
.error{color:#ff4c4c;}

input{
  width:90%;
  padding:8px;
  margin:8px 0;
  background:#111;
  border:1px solid #333;
  color:white;
}
</style>
</head>

<body>

<div id="authScreen">
  <div id="authBox">
    <h2>Login / Sign Up</h2>
    <p>You can only access and save files if you log in or sign up.</p>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <br>
    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>
    <button onclick="guest()">Use as Guest</button>
    <p id="authMessage"></p>
  </div>
</div>

<div id="topbar">WIDE - Python IDE</div>

<div id="toolbar">
  <button id="runBtn" onclick="runCode()">Run</button>
  <button onclick="newFile()">New</button>
  <button onclick="copyCode()">Copy</button>
  <button id="saveBtn" onclick="saveFile()" style="display:none;">Save</button>
  <button id="learnBtn" onclick="openLearnPython()" style="display:none;">LEARN PYTHON</button>
  <button onclick="logout()">Logout</button>
</div>

<div id="main">
  <div id="editorContainer">
    <textarea id="code">print("Welcome to WIDE!")</textarea>
  </div>
  <div id="divider"></div>
  <div id="outputContainer"></div>
</div>

<script>
let editor=CodeMirror.fromTextArea(document.getElementById("code"),{
  mode:"python",
  theme:"dracula",
  lineNumbers:true
});

let outputContainer=document.getElementById("outputContainer");
let runBtn=document.getElementById("runBtn");
let saveBtn=document.getElementById("saveBtn");
let learnBtn=document.getElementById("learnBtn");
let toolbar=document.getElementById("toolbar");

let currentUser=null;
let currentFileKey=null; // NEW

/* AUTO SAVE */
editor.on("change",()=>{
  if(currentFileKey){
    localStorage.setItem(currentFileKey, editor.getValue());
  }
});

/* AUTH + FILES */
function startIDE(){
  authScreen.style.display="none";
  if(currentUser!=="guest") saveBtn.style.display="inline-block";

  if(currentUser!=="guest"){
    let filesBtn=document.createElement("button");
    filesBtn.textContent="Files";
    toolbar.appendChild(filesBtn);

    let dropdown=document.createElement("div");
    dropdown.className="dropdown";

    /* HEADER WITH CLOSE BUTTON */
    let header=document.createElement("div");
    header.className="dropdown-header";
    header.innerHTML="<span>Files</span>";

    let close=document.createElement("span");
    close.className="close-btn";
    close.innerText="✖";
    close.onclick=()=>dropdown.classList.remove("show");

    header.appendChild(close);
    dropdown.appendChild(header);

    document.body.appendChild(dropdown);

    filesBtn.onclick=()=>{
      dropdown.classList.toggle("show");
      renderMenu();
    };

    function renderMenu(){
      dropdown.innerHTML="";
      dropdown.appendChild(header);

      let addBtn=document.createElement("button");
      addBtn.textContent="Add Code";
      addBtn.onclick=()=>{
        editor.setValue("");
        let fileName=prompt("Enter file name:");
        if(fileName){
          currentFileKey="file_"+currentUser+"_"+fileName;
          localStorage.setItem(currentFileKey,"");
        }
      };

      let viewBtn=document.createElement("button");
      viewBtn.textContent="View Files";
      viewBtn.onclick=()=>{
        dropdown.innerHTML="";
        dropdown.appendChild(header);

        for(let i=0;i<localStorage.length;i++){
          let k=localStorage.key(i);
          if(k.startsWith("file_"+currentUser+"_")){
            let btn=document.createElement("button");
            btn.textContent=k.replace("file_"+currentUser+"_","");
            btn.onclick=()=>{
              currentFileKey=k;
              editor.setValue(localStorage.getItem(k));
            };
            dropdown.appendChild(btn);
          }
        }
      };

      dropdown.appendChild(addBtn);
      dropdown.appendChild(viewBtn);
    }
  }
}

function login(){currentUser="user";startIDE();}
function guest(){currentUser="guest";startIDE();}

function runCode(){
  outputContainer.innerHTML="";
  Sk.configure({
    output:t=>outputContainer.innerHTML+=t+"<br>"
  });
  Sk.misceval.asyncToPromise(()=>{
    return Sk.importMainWithBody("<stdin>",false,editor.getValue(),true);
  });
}

function newFile(){editor.setValue("");currentFileKey=null;}
function copyCode(){navigator.clipboard.writeText(editor.getValue());}
function saveFile(){
  if(currentFileKey){
    localStorage.setItem(currentFileKey, editor.getValue());
    alert("Saved!");
  }
}
</script>

</body>
</html>
